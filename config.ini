; =====================================================================
;  Configuration du moniteur — VERSION GITHUB ACTIONS
;
;  ⚠️  NE METS PAS ton token/chat_id Telegram ici sur GitHub !
;      Sur GitHub, ils passent par les "Secrets" du dépôt (voir le guide).
;      Ce fichier ne contient QUE des réglages non sensibles.
; =====================================================================

[telegram]
; Laissé VIDE exprès : sur GitHub Actions, le token et le chat_id sont
; injectés depuis les Secrets (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID).
bot_token =
chat_id =

[monitor]
; Sur GitHub, la vraie cadence est fixée par le cron du workflow (5 min).
; interval_seconds ne sert qu'en mode boucle locale, on le laisse ici pour info.
interval_seconds = 300
connect_timeout = 10
read_timeout = 20
; 2 tentatives suffisent : avec 8 sources, 3 tentatives x 20 s sur plusieurs
; boutiques en panne feraient dépasser l'intervalle de 5 min du cron.
max_retries = 2
retry_backoff = 3
user_agent = Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36


; =====================================================================
;  SOURCES SURVEILLÉES
;
;  Une source = une boutique + UNE collection/catégorie.
;  Chaque source est indépendante : si une boutique tombe, les autres
;  continuent d'être surveillées normalement.
;
;  Pour AJOUTER une boutique Shopify (URL en /collections/… et /products/…) :
;      [source:mon-nom]
;      platform   = shopify
;      base_url   = https://laboutique.com      (+ /en si le site est en /en/)
;      collection = le-handle-de-la-collection  (le bout d'URL après /collections/)
;      label      = Nom affiché dans les alertes
;
;  Pour AJOUTER une catégorie e-monsite (site en /rubrique/ + fiches .html) :
;      [source:mon-nom]
;      platform    = emonsite
;      base_url    = https://laboutique.fr
;      page_url    = https://laboutique.fr/boutique/ma-categorie/   (page listée)
;      sitemap_url = https://laboutique.fr/sitemap.xml              (optionnel)
;      label       = Nom affiché dans les alertes
;
;  Pour DÉSACTIVER une source sans la supprimer : enabled = false
; =====================================================================

; --- mystic-ambre.fr (e-monsite) -------------------------------------
; Page des précommandes One Piece. Elle agrège déjà les produits de toutes
; ses sous-catégories (op-11, display-one-piece-fr, ld, playmat, ib…), donc
; une seule page à lire. Le stock est porté par l'attribut data-stock de
; chaque carte produit (0 = rupture), pas besoin d'ouvrir les fiches.
;
; sitemap_url est un filet de sécurité : si un nouveau produit était publié
; sans apparaître tout de suite dans le listing, il serait quand même repéré
; via le sitemap (sa fiche est alors lue une fois pour connaître son stock).
[source:mystic-ambre]
platform    = emonsite
base_url    = https://www.mystic-ambre.fr
page_url    = https://www.mystic-ambre.fr/boutique/pre-commande/one-piece-pre-co/
sitemap_url = https://www.mystic-ambre.fr/sitemap.xml
label       = Mystic-Ambre · One Piece préco

; --- hikarudistribution.com (Shopify) --------------------------------
[source:hikaru]
platform   = shopify
base_url   = https://hikarudistribution.com
collection = one-piece-card-game
label      = Hikaru Distribution

; --- cardlabtcg.com (Shopify, site en /en/) --------------------------
; ATTENTION : la collection "one-piece" ne contient qu'UN produit. Les vrais
; produits (displays, boosters, coffrets) vivent dans les collections
; ci-dessous — c'est pour ça qu'elles sont toutes surveillées.
[source:cardlab-display]
platform   = shopify
base_url   = https://cardlabtcg.com/en
collection = one-piece-display
label      = CardLab · Displays

[source:cardlab-booster]
platform   = shopify
base_url   = https://cardlabtcg.com/en
collection = one-piece-booster
label      = CardLab · Boosters

[source:cardlab-items]
platform   = shopify
base_url   = https://cardlabtcg.com/en
collection = items-coffrets-one-piece
label      = CardLab · Items & Coffrets

[source:cardlab-fr]
platform   = shopify
base_url   = https://cardlabtcg.com/en
collection = one-piece-fr
label      = CardLab · One Piece FR

[source:cardlab-one-piece]
platform   = shopify
base_url   = https://cardlabtcg.com/en
collection = one-piece
label      = CardLab · One Piece

; --- japan-figure.com (Shopify) --------------------------------------
[source:japanfigure]
platform   = shopify
base_url   = https://japan-figure.com
collection = one-piece-trading-cards
label      = Japan Figure
