name: Moniteur One Piece

# Déclenchement : toutes les 5 minutes (cron en UTC) + bouton manuel "Run".
# NB : 5 min est l'intervalle minimum autorisé par GitHub, et les horaires
# peuvent être légèrement retardés quand l'infra GitHub est chargée.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# Autorise le job à réécrire state.json dans le dépôt (persistance de l'état).
permissions:
  contents: write

# Empêche deux exécutions de se chevaucher.
concurrency:
  group: moniteur-one-piece
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    # Un passage dure 18 s en médiane, 31 s au 95e centile. Le 12/09/2026 l'un
    # d'eux est resté bloqué 52 min (une boutique répondant au compte-gouttes
    # maintient le read timeout de requests indéfiniment), monopolisant le
    # groupe de concurrence : les 4 passages suivants ont été annulés, soit
    # ~50 min sans surveillance. Ce plafond transforme ce cas en run rouge
    # (donc un e-mail) au lieu d'un trou silencieux.
    timeout-minutes: 8
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier stock / nouveaux produits
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --once

      - name: Sauvegarder l'état si changé
        run: |
          if [ -z "$(git status --porcelain state.json)" ]; then
            echo "Aucun changement d'état à sauvegarder."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # L'état qu'on vient de calculer fait autorité : il sort d'une lecture
          # fraîche de TOUTES les boutiques. Si master a bougé entre-temps, on le
          # réapplique tel quel sur le master à jour plutôt que de fusionner.
          cp state.json "$RUNNER_TEMP/etat-nouveau.json"

          for essai in 1 2 3; do
            git add state.json
            git commit -q -m "maj état moniteur [skip ci]" || true
            if git push -q; then
              echo "État mis à jour et sauvegardé."
              exit 0
            fi
            echo "Push refusé (master a bougé), nouvelle tentative $essai/3…"
            git fetch -q origin master
            git reset -q --hard origin/master
            cp "$RUNNER_TEMP/etat-nouveau.json" state.json
            if [ -z "$(git status --porcelain state.json)" ]; then
              echo "Un autre passage a déjà enregistré le même état."
              exit 0
            fi
          done

          echo "::error::Sauvegarde de l'état impossible après 3 tentatives."
          exit 1
